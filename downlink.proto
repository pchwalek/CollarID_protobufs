syntax = "proto3";

import "nanopb.proto";

// ================== SERVER → COLLAR DOWNLINK ==================
// Designed for LoRaWAN RX windows. Keep payloads minimal.
// At DR2 (SF10/125kHz) max payload is ~51 bytes.
// At DR5 (SF7/125kHz) max payload is ~222 bytes.
//
// Config updates use a transactional model with integrity checking:
//   1. CMD_CONFIG_BEGIN  → device snapshots live config into staging buffer
//   2. Config fragments sent (one per downlink, any order)
//      Each fragment carries fragment_index and fragment_total for integrity
//   3. CMD_CONFIG_COMMIT → device verifies all fragments received, then
//      applies staging → live, persists, notifies threads
//   If any fragments are missing, commit is rejected (staging discarded).
//   Device uplinks a config ACK/NACK so the server knows whether to retry.
//
// Folded form (fw 360+): the handshake rides inside the fragments. The first
// fragment carrying a cfg_txn_id the device has not committed opens staging
// exactly like CMD_CONFIG_BEGIN; once every fragment_total fragment has
// arrived the device commits on its own, exactly like CMD_CONFIG_COMMIT. The
// explicit commands still work on every build, and a CMD_CONFIG_COMMIT for a
// transaction the device already committed simply repeats the APPLIED ack, so
// a server that lost the ack can probe without restarting the push. Older
// firmware refuses a fragment while no transaction is open, so a server only
// folds for builds that understand it.
//
// Fragments carry no epoch from the server side (fw 360 servers): the device
// reads DownlinkPacket.epoch only to bootstrap an invalid clock, BEGIN and
// COMMIT still carry it, and the 6 bytes are what lets a dated time window
// fit one RX2 downlink.

// ---- Commands ----
enum CommandType {
  CMD_NONE           = 0;
  CMD_RESET          = 1;   // Reboot the device
  CMD_DROP_OFF       = 2;   // Detach the collar (irreversible)
  CMD_HIGH_FIX_ON    = 3;   // Enable high-fix GPS mode
  CMD_HIGH_FIX_OFF   = 4;   // Disable high-fix GPS mode
  CMD_SYNC_TIME      = 5;   // Sync RTC to server epoch
  CMD_BUZZ           = 6;   // Audible locate ping (future)
  CMD_ENGAGE         = 7;   // Engage the system (start scheduling)
  CMD_DISENGAGE      = 8;   // Disengage (stop all sensors, idle)
  CMD_CONFIG_BEGIN   = 9;   // Start config transaction (snapshot live → staging)
  CMD_CONFIG_COMMIT  = 10;  // Verify + apply staging → live, persist, notify
  CMD_CONFIG_ABORT   = 11;  // Discard staging buffer
  // 7.1 remote add-on control: routed into the collar's durable command
  // queue and forwarded to the detach add-on at its next rendezvous.
  CMD_ADDON_ARM      = 13;  // Arm detach at addon_arm_epoch (UTC s)
  CMD_ADDON_ABORT    = 14;  // Disarm the detach add-on
  // Missed-packet recovery (DESIGN_lorawan_reliability.md): server detected
  // a gap in packet_header.packet_index and asks the device to replay the
  // stored uplinks verbatim (pure retransmit, fPort 12).
  CMD_RESEND         = 15;  // Replay uplinks named by resend_from/resend_mask
  // Remote schedule push (DESIGN_remote_schedule_push.md): ask the device to
  // uplink its full ConfigPacket + sched_crc so the server can (re)learn the
  // running schedule — the SD-card-edit recovery path, and the freshness
  // prerequisite for building delta fragments.
  CMD_CONFIG_REPORT  = 16;  // Uplink current schedule config
  // Bench-only fence tester (DESIGN_geofence_actions.md): feed the geofence
  // engine a synthetic GPS fix so an operator can walk a desk collar through
  // a fence from the dashboard. The fix rides GeofenceData.vertices[0].
  // Compiled OUT of PRODUCTION_BUILD firmware — a production collar ignores
  // it entirely.
  CMD_TEST_FIX       = 17;

  // Pre-ship factory reset (fw 305+). Wipes recorded data (METADATA.CSV and
  // the whole date tree of audio/accel/GPS files), clears the uplink replay
  // ring and LoRa session state, and resets every setting to stock:
  // disengaged, default schedules, no radio credentials, no geofences.
  // Accepted ONLY over the BLE config tunnel — physical possession is the
  // authority. A radio downlink carrying this command is logged and ignored,
  // so no server bug or spoofed downlink can wipe a deployed collar.
  CMD_FACTORY_RESET  = 18;

  // Lost-mode beacon key (DESIGN_radio_security.md section 4.3, phase E4;
  // beacon/README.md is the public frame and key spec). Fw gate: firmware
  // main build TBD, set at merge. Writes the key set carried in
  // DownlinkPacket.beacon_key (BeaconKeySet: slot, gen, 16-byte key) into
  // the collar's internal-flash key store. From the next beacon the collar
  // sends the AES-128-CCM 0x4D frame under that key, with its transmit
  // counter's generation byte raised to gen and the sequence restarted at 0.
  // The collar refuses a gen that is not above its current generation
  // (BeaconKeyReport.gen), a gen of 0 or above 255, an all-zero key (what a
  // missing key field decodes to) and a slot this build does not hold; a
  // refused set leaves the collar exactly as it was. Outcome, state, gen and
  // key check value come back in CfgEchoPacket.beacon_key (ble.proto), never
  // the key. Provisioning is idempotent by that echo: a client reads gen and
  // kcv first and sends nothing when they already match the server's record.
  // Accepted ONLY over the BLE config tunnel, like CMD_FACTORY_RESET:
  // physical possession is the authority, and there is no CONFIG.CSV key. A
  // radio downlink carrying this command is logged and ignored. The collar
  // scrubs the key from its downlink buffer and the settings mailbox as soon
  // as it is stored. Firmware that predates the command logs an unknown
  // command and echoes no beacon_key; clients gate the control on the
  // reported build.
  CMD_BEACON_KEY_SET      = 19;

  // Magnetometer calibration. Starts a run: the collar samples its
  // magnetometer continuously while the operator turns the assembled collar
  // (battery in, housing closed, add-ons attached, away from metal) slowly
  // through every orientation for 30-60 s. Once enough of the sphere is
  // covered it fits hard and soft iron, appends the result to MAGCAL.CSV on
  // the card, and reports progress and outcome in CfgEchoPacket.mag_cal
  // (ble.proto). The LED pulses cyan during the capture, flashes green twice
  // (usable fit) or red twice (try again), then returns to blue. The buzzer
  // stays silent. Recorded magnetometer data stay raw counts: the fit is a
  // set of parameters stored beside the data, applied by the viewer.
  // A start while a run is active is ignored (the run carries on).
  // Accepted ONLY over the BLE config tunnel, like CMD_FACTORY_RESET:
  // physical possession is the authority, and a Bluetooth session exists
  // only while the collar is disengaged, so a run never competes with a
  // schedule. A radio downlink carrying either command is logged and ignored.
  // Firmware that predates them logs an unknown command and echoes no
  // mag_cal; clients also gate the button on the reported build.
  CMD_MAG_CALIBRATE       = 20;
  // Stops a running calibration: no fit is made and the calibration already
  // in force stays. mag_cal.state becomes ABORTED. No-op when no run is
  // active. BLE tunnel only, as above.
  CMD_MAG_CALIBRATE_ABORT = 21;

  // Erases the beacon key in the slot named by DownlinkPacket.beacon_key.slot
  // (absent = the beacon key) and keeps the transmit counter, so the
  // generation the next key set must exceed is preserved. From the next
  // beacon the collar sends the plaintext 0x4C frame again: the fallback a
  // keyed collar can always reach. beacon_key.gen and .key are ignored. A
  // clear with nothing held still answers CLEARED. BLE tunnel only, as
  // above: a radio downlink can never switch the encryption off.
  // CMD_FACTORY_RESET also erases the key and keeps the counter. Fw gate:
  // firmware main build TBD, set at merge.
  CMD_BEACON_KEY_CLEAR    = 22;

  // ---- Handheld commands (DESIGN_finder_two_way.md sections 6 and 6A) ----
  // A Handheld Receiver carries a signed 0x44 frame (cmd_frame) holding a
  // DownlinkPacket and sends it inside the receive window a collar opens
  // after its own direct-radio frame. Every command above that is allowed
  // remotely works the same way inside such a frame. The two session
  // commands are accepted ONLY that way (direct radio, signed); the collar
  // ignores them from LoRaWAN and the BLE tunnel.

  // Open a session: after its CMD-ACK the collar keeps listening for further
  // signed frames, at the spreading factor the handheld's INTENT asked for
  // when that is not below session.min_sf (else at its own), until
  // CMD_SESSION_CLOSE, session.idle_s without a frame, or session.max_s.
  // Then it returns to its own radio settings and schedule.
  CMD_SESSION_OPEN        = 23;
  // Close the session now (also ends it when sent outside one: no-op).
  CMD_SESSION_CLOSE       = 24;
  // Find mode: a beacon every find.interval_s for find.minutes, then back to
  // normal; the stored configuration is not touched. find.minutes 0 stops a
  // running find mode. Allowed on every carrier.
  CMD_FIND_MODE           = 25;
  // Lost mode off: clears lost_mode_enabled in the stored configuration and
  // restarts the collar into normal running (sensors back on). Allowed on
  // every carrier.
  CMD_LOST_MODE_OFF       = 26;

  // Bluetooth on for a while, for files (collarID_thread
  // docs/DESIGN_ble_bulk_transfer.md; DESIGN_finder_two_way.md 6A.6, A8).
  // The collar powers its Bluetooth radio, advertises, and serves its card's
  // files read-only on the bulk characteristic (...6fdc) for
  // ble_window.minutes (0 = 10, clamped 1..30), longer while a phone keeps
  // asking (at most 60 min from the open). Only a phone that proves it holds
  // ble_window.key (challenge-response, bulk/README.md) may list or read.
  // While the window is open the radio refuses every settings write, update
  // and add-on forward: settings travel over the signed radio or the magnet
  // session. Allowed over the direct radio (signed) and LoRaWAN; ignored
  // over the BLE tunnel. Refused (handheld ACK result 12, detail = reason)
  // without a key, on a radio that cannot serve files, without a card, or on
  // a low battery. Firmware that predates it answers 5 (unknown command).
  CMD_BLE_WINDOW          = 27;
}

// ---- Geofence ----
message GeoPoint {
  int32 latitude_e7  = 1;
  int32 longitude_e7 = 2;
}

message GeofenceData {
  uint32 fence_id    = 1;
  repeated GeoPoint vertices = 2;  // max 8
  bool   active      = 3;
}

// ---- High-fix parameters ----
message HighFixParams {
  uint32 duration_hours       = 1;  // default 24
  uint32 sample_interval_sec  = 2;  // default 300
}

// ---- Lost-mode beacon key set (CMD_BEACON_KEY_SET / _CLEAR) ----
// Which key family a set or clear addresses: the flash store keeps one
// record per slot, so the Phase-3 command key never forces a format change.
// The numbers match the firmware's beacon_key_purpose_t and the KDF labels
// in beacon/README.md.
enum BeaconKeySlot {
  BEACON_KEY_SLOT_BEACON  = 0;  // lost-mode beacon confidentiality, label CID-LORA-BCN; the only slot v1 firmware holds
  // Reserved for the signed command channel (label CID-LORA-CMD,
  // DESIGN_finder_two_way.md). Refused as REJECTED_ARG until the firmware
  // that holds it lands.
  BEACON_KEY_SLOT_COMMAND = 1;
}

// The key set CMD_BEACON_KEY_SET writes (at most 25 B inside the tunnel frame).
// The collar never sees a master: the server derives
// key = AES-CMAC(master, label || uid_le32 || gen) for this collar and hands
// the result over as is. The collar stores {slot, gen, kcv, key} and reports
// everything but the key. Fw gate: firmware main build TBD, set at merge.
message BeaconKeySet {
  BeaconKeySlot slot = 1;
  // Provision generation, 1..255, allocated by the server per uid32 and
  // bumped on every re-provision (new owner, suspected compromise, routine
  // rotation). It rides the counter's top byte on air and is part of the
  // derivation, so a re-provisioned collar transmits under a new key with a
  // fresh sequence. Must be above the collar's current generation
  // (BeaconKeyReport.gen); 255 is the last under a master.
  uint32 gen = 2;
  // The derived per-device AES-128 key, exactly 16 bytes (downlink.options
  // fixed_length, like the LoRaWAN keys: a frame with any other length fails
  // to decode and never reaches the store). Write-only: no message carries
  // it back, and an all-zero key is refused because that is what a missing
  // field decodes to.
  bytes key = 3;
}

// ================== CONFIG FRAGMENTS (STAGED) ==================
// All fields optional — only present fields overwrite staging.
// Omitted fields retain their current live value.

// Time window for a schedule slot (~4 bytes)
message ConfigTimeWindow {
  optional uint32 start_hour = 1;  // 0-23
  optional uint32 end_hour   = 2;  // 0-23
  // Calendar filters, same semantics as ble.proto TimeWindow (fw 357+):
  // 0 = unbounded. All five fields in one fragment are 27 B with the
  // epoch-less downlink wrapper fw 360 servers send (34 B with the old
  // wrapper, over the 33 B US915 RX2 floor — which is why older senders
  // split the kind into hours + day_mask, then start_day + end_day; merge on
  // the collar is field-wise, so a split is still valid). The server gates
  // these on fw_build: older firmware ignores the fields and would run the
  // slot every day.
  optional uint32 day_mask  = 3;  // bit 0 = Monday .. bit 6 = Sunday
  optional uint32 start_day = 4;  // UTC day number (epoch/86400); 0 = none
  optional uint32 end_day   = 5;  // UTC day number, exclusive; 0 = none
}

// Accelerometer (~4 bytes)
message ConfigAccelerometer {
  optional bool   enabled      = 1;
  optional uint32 sample_rate  = 2;  // 0=25Hz, 1=50Hz
  optional uint32 sensitivity  = 3;  // 0=2G, 1=4G, 2=8G
}

// Microphone (~9 bytes)
//
// sample_rate/bit_depth mirror ble.proto's MicSampleRate/MicBitDepth. They
// are uint32 here (as ConfigAccelerometer.sample_rate already is) because
// downlink.proto does not import ble.proto. Both are optional, so a server
// that never sets them costs zero extra bytes and a collar predating them
// skips the unknown fields and keeps its 16 kHz / 16-bit default.
message ConfigMicrophone {
  optional bool   enabled           = 1;
  optional bool   continuous_mode   = 2;
  optional uint32 sample_length_min = 3;
  optional uint32 sample_window_min = 4;
  optional uint32 sample_rate       = 5;  // 0=16kHz, 1=8kHz
  optional uint32 bit_depth         = 6;  // 0=16-bit, 1=8-bit
  optional uint32 sensitivity       = 7;  // 0=+0dB, 1=+6dB, 2=+12dB (fw 349+)
  optional uint32 codec             = 8;  // ble.proto MicCodec: 0=WAV, 1=FLAC (16-bit, 8/16 kHz)
  optional uint32 lsb_drop          = 9;  // low bits dropped per sample, 0-4 (ble.proto MicrophoneConfig)
}

// GPS (~4 bytes)
message ConfigGPS {
  optional bool   enabled              = 1;
  optional uint32 sample_interval_min  = 2;
  optional uint32 accuracy             = 3;  // 1-10
  // fw 358: the adaptive-sampling and tx-on-fix settings, same numbers as
  // ble.proto GPSConfig. Added so the BLE config tunnel can carry a whole
  // schedule (large schedules cannot travel as one Bluetooth write). Senders
  // include them only when set: a 10-field fragment is ~40 B on air, over
  // the 33 B US915 RX2 floor, and the collar's self-report would strand on
  // DR1's 53 B uplinks. Absent decodes as 0 = off, exactly as before.
  optional bool   dynamic_sampling_mode              = 4;
  optional uint32 medium_motion_vedba_threshold_x100 = 5;
  optional uint32 medium_motion_gps_interval_min     = 6;
  optional uint32 high_motion_vedba_threshold_x100   = 7;
  optional uint32 high_motion_gps_interval_min       = 8;
  optional bool   lorawan_tx_on_gps_fix              = 9;
  optional bool   lora_tx_on_gps_fix                 = 10;
}

// Magnetometer (~3 bytes; +2 with sample_rate_hz)
message ConfigMagnetometer {
  optional bool   enabled           = 1;
  optional uint32 sample_interval_s = 2;
  // Rate mode, the same numbers as ble.proto MagnetometerConfig.sample_rate_hz:
  // 0 = interval mode (sample_interval_s), else 1, 2, 4, 8 or 16 Hz, any
  // other value read as 0. Optional, so absent = leave the collar's value
  // alone, while an explicit 0 IS encoded and puts the slot back in interval
  // mode. A collar predating the field skips it and stays in interval mode;
  // the server refuses a non-zero rate for such firmware (fw gate: firmware
  // main build 425, merge c345dea 2026-09-25).
  optional uint32 sample_rate_hz    = 3;
}

// Generic sensor: light, environmental, particulate (~3 bytes)
message ConfigSampling {
  optional bool   enabled              = 1;
  optional uint32 sample_interval_min  = 2;
}

// Per-schedule radio enable/interval (~6 bytes)
message ConfigRadioTiming {
  optional bool   lorawan_enabled           = 1;
  optional uint32 lorawan_send_interval_min = 2;
  optional bool   lora_enabled              = 3;
  optional uint32 lora_send_interval_min    = 4;
  optional int32  tx_power_dbm              = 5;
}

// Mortality detection — collar-wide, lives in the radio config on the
// device (~6 bytes). Remote-safe by construction: enabling or disabling it
// can never silence the collar (the beacon is an EXTRA transmission on top
// of the scheduled radio cadence), so no reachability rail applies. Zero
// values mean "use firmware defaults" (48 h trigger, 240 min beacon),
// matching the CONFIG.CSV parser's semantics.
message ConfigMortality {
  optional bool   enabled               = 1;
  optional uint32 trigger_duration_hours = 2;
  optional uint32 transmit_interval_min  = 3;
}

// Global system flags — not per-schedule (~4 bytes)
message ConfigSystem {
  optional bool   verbose_logging       = 1;
  optional bool   enable_reset_on_error = 2;
  optional uint32 special_mode          = 3;
  // Number of active schedule slots (1-5). Lets a remote push add or remove
  // slots — the per-slot fragments above can only mutate existing ones.
  // Firmware rails: growing requires the same transaction to configure each
  // new slot (at minimum its time window); staging zeroes slots beyond the
  // live count at BEGIN so a stale array entry can never be resurrected.
  optional uint32 schedules_count       = 4;
  // Low-battery hibernation, whole percent of the battery (2026-11-12; fw
  // gate: firmware main build TBD, set at merge). The collar hibernates (stops
  // recording and sleeps, checking the battery every 8 hours) when its battery
  // reads at or below battery_hibernate_pct, and after such a sleep it runs
  // again only once the battery reads above battery_resume_pct. Defaults 10
  // and 20, what every collar ran before the setting; CONFIG.CSV keys of the
  // same names. Absent = leave the collar's value alone; staged and applied
  // at COMMIT like the slot count. The rails refuse the transaction (rule 14,
  // SCHED_RAIL_BAD_BATTERY_THRESHOLDS) unless the pair the commit would leave
  // (an absent field keeps the collar's value) has 5 <= hibernate <= 40,
  // 10 <= resume <= 60 and resume >= hibernate + 5
  // (contracts/collarid_contracts.json battery_thresholds). Reported in the
  // system fragment of every config report, and on Bluetooth in ble.proto
  // SystemStatePacket fields 11 and 12. Firmware that predates the fields
  // skips them and leaves its thresholds as they were.
  optional uint32 battery_hibernate_pct = 5;
  optional uint32 battery_resume_pct    = 6;
}

// Geofence definition, delivered through the config transaction one
// fragment per vertex plus one meta fragment (DESIGN_geofence_actions.md —
// a worst-case vertex is ~14 B against the 33 B RX2 floor). The meta
// fragment carries every scalar; vertex fragments carry vertex_index +
// vertex. vertex_count = 0 on a meta fragment deletes the fence. The same
// message is the self-report vocabulary (consumed reports a fired detach
// fence). Rails: R7 shape, R8 zone slot, R9 GPS off, R10 detach safety.
message ConfigGeofence {
  uint32 fence_id = 1;                     // 1..4
  optional uint32 action = 2;              // 0=SCHEDULE_OVERRIDE 1=DETACH 2=REPORT_ONLY
  optional uint32 zone_slot = 3;           // SCHEDULE_OVERRIDE: slot to preempt with
  optional uint32 confirm_fixes = 4;       // default 2
  optional uint32 min_dwell_min = 5;       // default 15; state lock after transitions
  optional uint32 max_hacc_m = 6;          // 0 = no accuracy gate
  optional uint32 start_epoch = 7;         // 0 = armed on delivery
  optional uint32 expiry_epoch = 8;        // mandatory for DETACH (<= start+30 d)
  optional uint32 vertex_count = 9;        // meta fragment; 0 = delete fence
  optional uint32 vertex_index = 10;       // vertex fragment
  optional GeoPoint vertex = 11;           // vertex fragment
  optional bool consumed = 12;             // report only: detach fence has fired
}

// ---- Config fragment wrapper ----
// Pairs a schedule slot index with one or more sensor/system configs.
// fragment_index and fragment_total enable integrity checking on commit.
//
// The settings were a oneof until fw 360. Plain optional fields with the
// same numbers are byte-identical on the wire, so a fragment carrying ONE
// setting decodes the same on every build. A fragment carrying SEVERAL
// settings (server-side packing, and the fw 360 self-report) is applied
// setting by setting by fw 360+; older nanopb keeps only the last setting it
// saw, so senders pack only for builds that understand it. Every setting in
// a fragment applies to the same schedule_index.
// CMD_SESSION_OPEN parameters. The collar clamps each value to its own
// limits (max_s 5..120, idle_s 2..30) and refuses a min_sf outside 7..12.
message SessionParams {
  uint32 max_s  = 1;  // the session ends this many seconds after it opens
  uint32 idle_s = 2;  // ... or after this many seconds with no frame
  uint32 min_sf = 3;  // the lowest SF (7..12) the INTENT may ask for; 0 = keep the collar's own
}

// CMD_FIND_MODE parameters. The collar clamps interval_s to 4..600 and
// minutes to 0..120 (0 stops a running find mode).
message FindMode {
  uint32 interval_s = 1;
  uint32 minutes    = 2;
}

// CMD_BLE_WINDOW parameters. The collar clamps minutes (0 = 10, 1..30).
// key is the window key, exactly 16 bytes, chosen at random by the server
// for this one command and handed to the phone that will connect (with the
// signed frame, over TLS). It travels encrypted inside the 0x44 frame (or
// LoRaWAN's AppSKey). The collar keeps it in RAM for the window only. An
// absent or all-zero key refuses the window.
message BleWindow {
  uint32 minutes = 1;
  bytes  key     = 2;
}

// The direct-radio and lost-mode settings, for ConfigFragment.cfg_radio
// (pushable remotely) and as the input of PacketHeader.radio_crc. Mirrors
// ble.proto LoRaConfig + the lost-mode fields of RadioConfigPacket with plain
// numbers, because the server never loads ble.proto. A field left absent in a
// fragment keeps the collar's value.
message RadioSettings {
  optional uint32 spreading_factor      = 1;   // ble.proto RadioSpreadingFactor value: 0 = SF7 ... 5 = SF12
  optional uint32 bandwidth             = 2;   // ble.proto RadioBandwidth value: 0 = 125, 1 = 250, 2 = 500 kHz
  optional uint32 coding_rate           = 3;   // ble.proto RadioCodingRate value: 0 = 4/5 ... 3 = 4/8
  optional int32  tx_power_dbm          = 4;
  optional uint32 sync_word             = 5;
  optional uint32 frequency_mhz         = 6;   // as LoRaConfig.frequency (whole MHz)
  optional bool   rx_listen             = 7;
  optional bool   lost_mode_enabled     = 8;
  optional uint32 lost_activation_epoch = 9;
  optional uint32 lost_interval_min     = 10;
  optional int32  lost_tx_power_dbm     = 11;
}

message ConfigFragment {
  uint32 schedule_index = 1;  // target schedule slot (0-4)
  uint32 fragment_index = 2;  // 0-based index of this fragment in the transaction
  uint32 fragment_total = 3;  // total number of fragments the server will send

  optional ConfigTimeWindow    cfg_time_window   = 4;
  optional ConfigAccelerometer cfg_accelerometer = 5;
  optional ConfigMicrophone    cfg_microphone    = 6;
  optional ConfigGPS           cfg_gps           = 7;
  optional ConfigMagnetometer  cfg_magnetometer  = 8;
  optional ConfigSampling      cfg_light         = 9;
  optional ConfigSampling      cfg_environmental = 10;
  optional ConfigSampling      cfg_particulate   = 11;
  optional ConfigRadioTiming   cfg_radio_timing  = 12;
  optional ConfigSystem        cfg_system        = 13;  // global, schedule_index ignored
  optional ConfigMortality     cfg_mortality     = 14;  // global, schedule_index ignored
  optional ConfigGeofence      cfg_geofence      = 15;  // global, schedule_index ignored
  // Direct-radio and lost-mode settings (global, schedule_index ignored).
  // Applied at COMMIT; when the transaction runs inside a handheld session,
  // the radio part waits for the session to end (changing the radio would
  // end it). The rails refuse a change that leaves no radio enabled.
  optional RadioSettings       cfg_radio         = 16;
}

// ---- Main downlink envelope ----
message DownlinkPacket {
  uint32 epoch = 1;               // server UTC epoch for RTC sync
  CommandType command = 2;         // command to execute

  optional HighFixParams high_fix_params = 3;
  optional GeofenceData geofence = 4;

  // Config fragment: one per downlink.
  // Only processed when a config transaction is open (after CMD_CONFIG_BEGIN).
  // On CMD_CONFIG_COMMIT, device checks that all fragment_total fragments
  // were received (via a bitmask indexed by fragment_index). If any are
  // missing, commit is rejected, staging is discarded, and the device
  // uplinks a NACK with the missing fragment bitmask so the server can retry.
  optional ConfigFragment config = 5;

  // CMD_ADDON_ARM: the armed drop-off time. Deliberately NOT the epoch
  // field above — that one is the RTC-sync reference on every downlink.
  optional uint32 addon_arm_epoch = 6;

  // CMD_RESEND: bit i of resend_mask set => replay the stored uplink with
  // packet_index == resend_from + i (bit 0 = resend_from itself), so one
  // command names up to 32 indices. Device replays at most a few per
  // command (duty cycle); the server re-requests the rest later.
  optional uint32 resend_from = 7;
  optional uint32 resend_mask = 8;

  // Config transaction id, present on CMD_CONFIG_BEGIN/COMMIT/ABORT and on
  // every fragment of that transaction. Echoed back in the device's
  // AckPacket so a retried COMMIT and a stale ack are distinguishable.
  // Server-assigned, monotonically increasing per device; 0 = legacy client.
  optional uint32 cfg_txn_id = 9;

  // CMD_CONFIG_REPORT scope (fw 360+): which parts of the config to report.
  // Bits 0-4 = schedule slots 0-4, bit 5 = the collar-wide system+mortality
  // fragment, bit 6 = the geofences. Absent or 0 = everything, which is also
  // what older firmware sends (it ignores the field). The report echoes the
  // mask in ConfigReport.report_mask so the server merges instead of
  // replacing.
  optional uint32 report_mask = 10;

  // CMD_BEACON_KEY_SET: the key set to store. CMD_BEACON_KEY_CLEAR: only
  // slot is read (absent = the beacon key). Ignored with every other
  // command, and always ignored over the radio (BLE tunnel only). Fw gate:
  // firmware main build TBD, set at merge.
  optional BeaconKeySet beacon_key = 11;

  // CMD_SESSION_OPEN parameters (signed direct-radio frames only).
  optional SessionParams session = 12;
  // CMD_FIND_MODE parameters.
  optional FindMode find = 13;
  // CMD_ADDON_ARM alternative to addon_arm_epoch: arm the drop-off for this
  // many seconds after the collar receives the command. Lets a handheld carry
  // a detach signed before a trip and use it at a moment chosen in the field,
  // with no signal (the signed frame's validity window bounds when). When
  // both are present addon_arm_epoch wins.
  optional uint32 addon_arm_delay_s = 14;
  // CMD_BLE_WINDOW parameters (24 B with the command: fits the 33 B RX2
  // floor and a signed frame).
  optional BleWindow ble_window = 15;
}
